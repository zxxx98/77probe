services:
  tinyprobe:
    image: ghcr.io/zxxx98/77probe:latest
    ports:
      - "23333:8080"
    environment:
      TINYPROBE_ADDR: ":8080"
      TINYPROBE_DB_PATH: "/data/tinyprobe.db"
      TINYPROBE_SECURE_COOKIES: "false"
    volumes:
      - tinyprobe-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  tinyprobe-data:
